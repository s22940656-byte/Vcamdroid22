name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip VcamDroid.zip -d extracted

      - name: Fix themes.xml
        run: python3 -c "
import os
path = 'extracted/VcamDroid/app/src/main/res/values/themes.xml'
os.makedirs(os.path.dirname(path), exist_ok=True)
with open(path, 'w') as f:
    f.write('''<?xml version=\"1.0\" encoding=\"utf-8\"?>
<resources>
    <style name=\"Theme.VcamDroid\" parent=\"Theme.AppCompat.NoActionBar\">
    </style>
</resources>''')
print('themes.xml written')
"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        working-directory: extracted/VcamDroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VcamDroid-debug
          path: extracted/VcamDroid/app/build/outputs/apk/debug/app-debug.apk
